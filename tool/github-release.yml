# Pushing a tag like v1.0.0 builds the Android and Windows downloads and publishes them
# as a release. The download page links to the latest release's files by name.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MAFIA_KEYSTORE_BASE64 }}
          MAFIA_KEYSTORE_PASSWORD: ${{ secrets.MAFIA_KEYSTORE_PASSWORD }}
        run: |
          # Without the secrets, the APK gets a throwaway key and won't update in place.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mafia.jks"
            export MAFIA_KEYSTORE="$RUNNER_TEMP/mafia.jks"
          fi
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk Mafia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Mafia.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Mafia-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Mafia.apk Mafia-Setup.exe --title "مافيا ${GITHUB_REF_NAME#v}" --notes "حمّل اللعبة من https://abdallah4f7.github.io/mafia/"
