# Pushing a tag like v1.0.0 tests the game and builds the web, Android and Windows
# versions. Nothing is published from here: the signing key never leaves the
# developer's machine, so the APK is signed there and the release made from there.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /mafia/app/ --pwa-strategy=none
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - run: flutter build apk --release --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the portable app
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Mafia-Windows.exe
